server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: produits-service
              uri: lb://produits-service
              predicates:
                - Path=/api/produits/**
            - id: avis-service
              uri: lb://avis-service
              predicates:
                - Path=/api/avis/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}