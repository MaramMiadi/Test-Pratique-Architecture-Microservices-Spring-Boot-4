spring:
  application:
    name: avis-service

  datasource:
    url: jdbc:postgresql://postgres-avis:5432/avisdb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8092